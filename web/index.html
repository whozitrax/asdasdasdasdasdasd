<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1018" />
  <title>GiftRelayer</title>
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <section class="topbar">
      <div>
        <div class="eyebrow">GIFTRELAYER</div>
        <h1 id="pageTitle">Предложение</h1>
      </div>
      <button id="closeTop" class="icon-button" aria-label="Закрыть">×</button>
    </section>

    <section id="screen" class="screen-card skeleton-card">
      <div class="status-pill"><span class="dot"></span><span id="statusText">Загрузка...</span></div>
      <div class="gift-stage">
        <img id="giftImage" alt="Telegram Gift" hidden />
        <div id="giftFallback" class="gift-fallback">🎁</div>
      </div>
      <div class="gift-meta">
        <h2 id="giftName">Загружаем подарок</h2>
        <p id="subtitle">Проверяем предложение…</p>
        <div id="price" class="price">—</div>
        <div id="timer" class="timer">—</div>
      </div>
    </section>

    <section id="actions" class="actions"></section>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
